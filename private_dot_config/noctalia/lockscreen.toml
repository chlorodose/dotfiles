[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["lockscreen-login-box", "lockscreen-clock"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget.lockscreen-clock]
box_height = 224.0
box_width = 624.0
cx = 1272.0
cy = 256.0
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-clock.settings]
background = true
background_color = "surface"
background_opacity = 0.8
background_radius = 32
center_text = true
circle = true
clock_style = "digital"
color = "on_surface"
font_family = ""
format = "{:%H:%M}"
shadow = true
timezone = ""

[lockscreen_widgets.widget.lockscreen-login-box]
type = "login_box"
box_height = 196.0
box_width = 810.0
cx = 1280.0
cy = 1262.0
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0

[lockscreen_widgets.widget.lockscreen-login-box.settings]
background_color = "surface_variant"
background_opacity = 0.8
background_radius = 20.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true
